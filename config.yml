# Andean Passes: paths and fixed parameters read by the scripts. Run every script from the repository root.
paths:
  data_dir: data/raw            # third-party inputs (not in git); may point outside the repository
  interim: data/interim
  outputs: outputs

seed: 20261101                  # random divide cells of the identity test (46) and of the review sheet (42)

params:
  gmba_margin_km: 20            # margin around the GMBA Andes (D12)
  tropics_lat: [11, -23.5]      # reported tropics (D1)

# One terrain (hypsometric) ramp for figures coloured by elevation: metres and colours at each stop
style:
  elev_ramp:
    m:   [0, 500, 1500, 2500, 3500, 4500, 5500, 6500]
    col: ["#2F6B45", "#6FA35A", "#CDC27A", "#D3A35F", "#A9733F", "#7E5741", "#A4968D", "#E4DED8"]
