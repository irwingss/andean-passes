# Andean Passes: paths and fixed parameters. Every R script reads this file, and so do the two flood scripts.
# Run all scripts from the repository root.
paths:
  data_dir: data/raw            # third-party inputs (about 25 GB, not in git); may point outside the repository
  interim: data/interim
  outputs: outputs

seed: 20261101

# Remote rasters
remote:
  glo30_bucket: "https://copernicus-dem-30m.s3.amazonaws.com"

# Operational definitions; sensitivity values are listed after the default
params:
  segment_km: 0.5
  depth_m: [100, 50, 200, 300]
  gateway_window_km: [100, 50, 250]
  montane_gap_m: [2000, 1500, 2500]
  flank_m: [1000, 500, 1500]
  flank_max_trace_km: 150
  flank_buffer_km: 5
  gmba_margin_km: 20
  tropics_lat: [11, -23.5]
  huancabamba: {lat: [-7.5, -4.0], max_elev_m: 3000, min_depth_m: 50}   # extra cols kept in the tables for a companion study

# One terrain (hypsometric) ramp for every figure coloured by elevation: metres and colours at each stop
style:
  elev_ramp:
    m:   [0, 500, 1500, 2500, 3500, 4500, 5500, 6500]
    col: ["#2F6B45", "#6FA35A", "#CDC27A", "#D3A35F", "#A9733F", "#7E5741", "#A4968D", "#E4DED8"]
